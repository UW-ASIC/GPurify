# Property/invariant harness — layer 2 of docs/TESTING.md.
#
# Goldens prove the rewrite changed nothing; they cannot prove the original was
# right, because they were generated from it. These properties are the layer
# that can find a bug both trees share. They assert invariants that must hold
# for *any* input, so they are independent of either implementation.
#
# Its own workspace and excluded from the root one, so it never perturbs a
# `cargo test --workspace` or `cargo mutants` run. The property bodies port
# into `crates_clean` as ordinary #[test]s once that tree exists.
[workspace]

[package]
name = "proptest-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gdsverify = { path = "../../crates/engine" }
serde_json = "1"

[profile.release]
opt-level = 3
