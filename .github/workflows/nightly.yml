name: Nightly

# The nightly tier of docs/testing-plan.md §5. Each floor is stated in the
# step that checks it; the plan's gate table says where each number came from.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  # A pull request labelled `heavy` runs this tier too, so heavy work runs here
  # rather than on a developer's machine.
  pull_request:
    types: [labeled, synchronize]

env:
  CARGO_TERM_COLOR: always

jobs:
  ignored:
    name: cargo test -- --ignored
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The exhaustive enumerations, the 10^5-case property twins and the
      # nightly golden field solves; a failing property prints its seed. The
      # differentials need the oracle shell and run in the `oracles` job.
      - run: >-
          cargo test --workspace -- --ignored --skip klayout_mirror
          --skip netgen_differential

  oracles:
    name: differentials in the oracle shell
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The KLayout mirror (L6): corpus, merge-depth DRC fixtures and 3000
      # random layouts. One test at a time; each runs at most four klayouts.
      - run: nix develop .#oracles --command cargo test --test klayout -- --ignored --test-threads=1
      # Netgen on every circuit of the LVS enumeration with every single
      # fault (4223 circuits; F3). One test at a time; each runs at most two
      # tools at once (gpurify_testgen::oracle::MAX_RUNNING).
      - run: >-
          nix develop .#oracles --command cargo test --test exhaustive --
          --ignored --test-threads=1 netgen_differential

  fuzz:
    name: fuzz ${{ matrix.target }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The seed directories are the ones tests/fuzz_regressions.rs replays.
        include:
          - target: gds
            seeds: tests/fixtures/_source
          - target: gds_structured
            seeds: ""
          - target: deck
            seeds: pdks fuzz/seeds/deck
          - target: netlist_spice
            seeds: tests/fixtures/lvs_refs fuzz/seeds/netlist_spice
          - target: netlist_spectre
            seeds: fuzz/seeds/netlist_spectre
          - target: intent
            seeds: fuzz/seeds/intent
          - target: liberty_spec
            seeds: fuzz/seeds/liberty_spec
          - target: drc_e2e
            seeds: ""
    steps:
      - uses: actions/checkout@v4
      # Nightly in this job only: cargo-fuzz needs it, and rebuilds std with
      # the sanitizer (rust-src).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus carries over from night to night.
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # One hour per target. A crash, a leak, an input over 2 GiB of memory or
      # one taking over 20 s fails the job; the input is uploaded below, to be
      # minimised (`cargo fuzz tmin`) into fuzz/regressions/<target>/.
      - run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }} -- \
            -max_total_time=3600 -rss_limit_mb=2048 -timeout=20
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  mutants:
    name: cargo mutants (geom, check)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # A tenth of the mutants of geom and check, a different tenth each day
      # of the year, each tested against its own crate's tests. Missed mutants
      # (exit 2) and timeouts (exit 3) are scored below; anything else fails.
      - run: |
          set +e
          cargo mutants -p gpurify-geom -p gpurify-check \
            --shard "$(( 10#$(date +%j) % 10 ))/10" --sharding round-robin -j 2
          code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || [ "$code" -eq 3 ] || exit "$code"
      # Mutation score = (caught + timeouts) / (caught + timeouts + missed).
      # Floors: geom 75 %, check 65 %.
      - run: |
          jq -r '[.outcomes[] | select(.scenario | type == "object")
                  | {p: .scenario.Mutant.package, s: .summary}]
                 | group_by(.p)[]
                 | "\(.[0].p) \(map(select(.s == "CaughtMutant" or .s == "Timeout")) | length) \(map(select(.s == "MissedMutant")) | length)"' \
            mutants.out/outcomes.json |
          while read -r package killed missed; do
            case "$package" in
              gpurify-geom) floor=75 ;;
              gpurify-check) floor=65 ;;
            esac
            awk -v p="$package" -v k="$killed" -v m="$missed" -v f="$floor" 'BEGIN {
              s = 100 * k / (k + m)
              printf "%s: %d killed, %d missed, score %.1f%% (floor %d%%)\n", p, k, m, s, f
              exit s < f
            }'
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out

  coverage:
    name: coverage floor (geom, check)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'heavy')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --json --summary-only --output-path coverage.json
      # Region coverage of each crate's src/, from the merge-depth suite.
      # Floors: geom 96 %, check 95 %.
      - run: |
          for pair in geom:96 check:95; do
            crate="${pair%%:*}" floor="${pair##*:}"
            jq -r --arg dir "crates/$crate/src/" '[.data[0].files[]
                  | select(.filename | contains($dir)) | .summary.regions]
                | "\(map(.covered) | add) \(map(.count) | add)"' coverage.json |
            while read -r covered count; do
              awk -v c="$crate" -v k="$covered" -v n="$count" -v f="$floor" 'BEGIN {
                s = 100 * k / n
                printf "%s: %d of %d regions, %.1f%% (floor %d%%)\n", c, k, n, s, f
                exit s < f
              }'
            done
          done
