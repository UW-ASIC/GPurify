[package]
name = "gpurify-pex"
version = "0.1.0"
edition = "2021"

[dependencies]
gpurify-geom = { workspace = true }
gpurify-ingest = { workspace = true }
gpurify-topology = { workspace = true }
gpurify-report = { workspace = true }
gpurify-quasistatic = { workspace = true }
thiserror = { workspace = true }
wide = { workspace = true }

[features]
# GPU on by default, exactly as it was when `vulkano` was an unconditional
# dependency here; the flag just forwards to the solver crate that owns it.
default = ["gpu"]
gpu = ["gpurify-quasistatic/gpu"]

[dev-dependencies]
gpurify-testgen = { workspace = true }

[lints]
workspace = true
