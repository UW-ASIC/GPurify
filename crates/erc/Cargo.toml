[package]
name = "gdsverify-erc"
version = "0.1.0"
edition = "2021"
description = "Electrical-rule checking and tapeout signoff for gdsverify."

[features]
default = []
gpu = ["gdsverify-backend/gpu", "gdsverify-core/gpu", "dep:vulkano", "dep:vulkano-shaders"]

[dependencies]
gdsverify-backend = { path = "../backend" }
gdsverify-core = { path = "../core" }
gdsverify-lvs = { path = "../lvs" }
gdsverify-pex = { path = "../pex" }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
vulkano = { workspace = true, optional = true }
vulkano-shaders = { workspace = true, optional = true }

[lints]
workspace = true
