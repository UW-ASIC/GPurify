[package]
name = "gdsverify-core"
version = "0.1.0"
edition = "2021"
description = "Core data model (SoA geometry, exact predicates, connectivity, layout I/O) for gdsverify."

[features]
default = []
gpu = ["gdsverify-backend/gpu", "dep:vulkano", "dep:vulkano-shaders"]

[dependencies]
gdsverify-backend = { path = "../backend" }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }
vulkano = { workspace = true, optional = true }
vulkano-shaders = { workspace = true, optional = true }

[lints]
workspace = true
