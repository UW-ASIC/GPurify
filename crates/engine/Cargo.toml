[package]
name = "gdsverify"
version = "0.1.0"
edition = "2021"
description = "GDS verification facade: re-exports DRC, LVS, PEX, ERC under stable paths."

[features]
default = []
gpu = [
    "gdsverify-backend/gpu",
    "gdsverify-core/gpu",
    "gdsverify-drc/gpu",
    "gdsverify-erc/gpu",
    "gdsverify-lvs/gpu",
    "gdsverify-pex/gpu",
]

[dependencies]
gdsverify-backend = { path = "../backend" }
gdsverify-core = { path = "../core" }
gdsverify-drc = { path = "../drc" }
gdsverify-erc = { path = "../erc" }
gdsverify-lvs = { path = "../lvs" }
gdsverify-pex = { path = "../pex" }
serde = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "fixture_corpus"
path = "../../tests/fixtures/build_fixtures.rs"

[[test]]
name = "verify_drc"
path = "../../tests/test_drc.rs"

[[test]]
name = "verify_lvs"
path = "../../tests/test_lvs.rs"

[[test]]
name = "verify_erc"
path = "../../tests/test_erc.rs"

[[test]]
name = "verify_pex"
path = "../../tests/test_pex.rs"

[lints]
workspace = true
