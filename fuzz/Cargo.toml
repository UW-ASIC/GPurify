# The fuzz targets of docs/testing-plan.md L4: `cargo +nightly fuzz run <target>`
# from the repository root. Each target's entry point and oracle is in
# `oracles.rs`, which `tests/fuzz_regressions.rs` also replays on stable.
[package]
name = "gpurify-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gpurify = { path = ".." }
gpurify-ingest = { path = "../crates/ingest" }
gpurify-testgen = { path = "../crates/testgen" }

# Its own workspace: it builds only on nightly, with the sanitizer flags
# cargo-fuzz passes, and the main workspace never depends on libfuzzer-sys.
[workspace]
members = ["."]

[[bin]]
name = "gds"
path = "fuzz_targets/gds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gds_structured"
path = "fuzz_targets/gds_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deck"
