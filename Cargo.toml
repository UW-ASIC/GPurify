[workspace]
resolver = "2"
members = [
    "crates/units",
    "crates/core",
    "crates/ingest",
    "crates/derived",
    "crates/topology",
    "crates/report",
    "crates/drc",
    "crates/erc",
    "crates/lvs",
    "crates/pex",
    "crates/export",
    "crates/engine",
    "crates/cli",
]
exclude = ["tools"]

[workspace.dependencies]
gpurify-units = { path = "crates/units" }
gpurify-core = { path = "crates/core" }
gpurify-ingest = { path = "crates/ingest" }
gpurify-derived = { path = "crates/derived" }
gpurify-topology = { path = "crates/topology" }
gpurify-report = { path = "crates/report" }
gpurify-drc = { path = "crates/drc" }
gpurify-erc = { path = "crates/erc" }
gpurify-lvs = { path = "crates/lvs" }
gpurify-pex = { path = "crates/pex" }
gpurify-export = { path = "crates/export" }
gpurify-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
flate2 = "1"
thiserror = "1"
wide = "0.7"
# GPU: AOT SPIR-V from GLSL. No JIT. Quasi-static PEX only — see docs/GPU.md.
vulkano = "0.35"
vulkano-shaders = "0.35"

# One policy, inherited by every crate.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Nearly every function in a data-oriented tree is a pure transform returning a
# value, so this fires on all of them and says nothing. Apply #[must_use] at the
# few sites where dropping the result is genuinely the bug.
must_use_candidate = "allow"
# Definition-Phase: bodies are `todo!()`, so clippy cannot see the `push` that
# makes a `&mut Vec` parameter necessary. Remove in the Implementation-Phase.
ptr_arg = "allow"
# The cast_* allows are deliberately NOT inherited from the old tree. They were
# justified by "DBU coords are i32 by design", which is no longer true: Dbu is a
# newtype over i64. A cast that needs allowing now needs it at the site.

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The optimised-out check for test-adapter seams disassembles this profile, so it
# keeps symbols. Same codegen as release otherwise.
[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3  # optimize deps even in dev; our own crates stay fast to compile
