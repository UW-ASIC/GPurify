[workspace]
resolver = "2"
members = [
    "crates/backend",
    "crates/core",
    "crates/drc",
    "crates/erc",
    "crates/lvs",
    "crates/pex_analytical",
    "crates/pex_quasistatic",
    "engine",
    "macros",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
flate2 = "1"
cubecl = { version = "0.10" }
