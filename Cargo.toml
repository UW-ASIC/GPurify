[package]
name = "gpurify"
version = "0.1.0"
edition = "2021"

[dependencies]
gpurify-geom = { workspace = true }
gpurify-check = { workspace = true }
gpurify-ingest = { workspace = true }
gpurify-extract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
gpurify-testgen = { workspace = true }

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/geom",
    "crates/ingest",
    "crates/check",
    "crates/extract",
    "crates/testgen",
]
exclude = ["tools"]

[workspace.dependencies]
gpurify-geom = { path = "crates/geom" }
gpurify-ingest = { path = "crates/ingest" }
gpurify-check = { path = "crates/check" }
gpurify-extract = { path = "crates/extract" }
gpurify-testgen = { path = "crates/testgen" }

# External dep
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
num-complex = "0.4"
flate2 = "1"
thiserror = "1"
wide = "0.7"

# Some are based off preference, some disagree with branch-less programming principles or using SIMD.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
neg_cmp_op_on_partial_ord = "allow"
needless_bitwise_bool = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3
