[package]
name = "gpurify"
version = "0.1.0"
edition = "2021"

[dependencies]
gpurify-core = { workspace = true }
gpurify-derived = { workspace = true }
gpurify-drc = { workspace = true }
gpurify-engine = { workspace = true }
gpurify-erc = { workspace = true }
gpurify-export = { workspace = true }
gpurify-ingest = { workspace = true }
gpurify-lvs = { workspace = true }
gpurify-pex = { workspace = true }
gpurify-report = { workspace = true }
gpurify-topology = { workspace = true }
gpurify-units = { workspace = true }

[dev-dependencies]
gpurify-testgen = { workspace = true }
# `tests/common/` reads `tests/fixtures/expectations.json`, and its
# `gen_fixtures` reads `manifest.json` to split the per-case GDS out of
# `_source/`. Both crates are already in the workspace graph, so this adds no
# new dependency.
serde = { workspace = true }
serde_json = { workspace = true }


[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/units",
    "crates/core",
    "crates/ingest",
    "crates/derived",
    "crates/topology",
    "crates/report",
    "crates/drc",
    "crates/erc",
    "crates/lvs",
    "crates/pex",
    "crates/export",
    "crates/engine",
    "crates/cli",
    "crates/testgen",
]
exclude = ["tools"]

[workspace.dependencies]
gpurify-units = { path = "crates/units" }
gpurify-core = { path = "crates/core" }
gpurify-ingest = { path = "crates/ingest" }
gpurify-derived = { path = "crates/derived" }
gpurify-topology = { path = "crates/topology" }
gpurify-report = { path = "crates/report" }
gpurify-drc = { path = "crates/drc" }
gpurify-erc = { path = "crates/erc" }
gpurify-lvs = { path = "crates/lvs" }
gpurify-pex = { path = "crates/pex" }
gpurify-export = { path = "crates/export" }
gpurify-engine = { path = "crates/engine" }
gpurify-testgen = { path = "crates/testgen" }

# External dep
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
flate2 = "1"
thiserror = "1"
wide = "0.7"

# GPU: AOT SPIR-V from GLSL, for Quasi-static PEX only.
# `default-features = false` drops the `x11` feature, which pulls `x11-dl` and
# `x11rb` in and makes every binary downstream of `pex` link `-lxcb`. This is a
# headless compute path with no window-system integration, so it needs none of
# it — and with it on, `cargo test` outside `nix develop` fails at the link step
# rather than at compile.
vulkano = { version = "0.35", default-features = false }
# `vulkano-shaders` is pinned but unused, and deliberately: it pulls in
# `shaderc-sys`, which needs a system `libshaderc` or `cmake`, and neither is
# present outside `nix develop`. Depending on it would make `cargo build` fail
# for every crate downstream of `pex` outside the dev shell. The P2P Laplace
# kernel is compiled by `glslc` and committed as SPIR-V; the regeneration
# command is in `crates/pex/shaders/p2p_laplace.comp`.
vulkano-shaders = "0.35"

# Some are based off preference, some disagree with branch-less programming principles or using SIMD.
[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
neg_cmp_op_on_partial_ord = "allow"
needless_bitwise_bool = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3
